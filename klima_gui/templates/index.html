<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Klimatyzacja</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 16px;
  }
  h1 { font-size: 1.3rem; text-align: center; margin: 8px 0 24px; }
  .card {
    background: #1e1e1e;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card.on { border: 2px solid #3ab0ff; }
  .card.off { border: 2px solid #333; opacity: 0.75; }
  .card.drying { border: 2px solid #f0a020; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .name { font-size: 1.2rem; font-weight: 600; }
  .indoor { font-size: 0.9rem; color: #aaa; margin-top: 4px; }
  .status-text { font-size: 0.85rem; color: #f0a020; margin-top: 4px; }
  .error { font-size: 0.85rem; color: #ff6b6b; margin-top: 4px; }
  .switch {
    position: relative; width: 56px; height: 32px; flex-shrink: 0;
  }
  .switch input { display: none; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #444; border-radius: 32px; transition: 0.2s;
  }
  .slider::before {
    content: ""; position: absolute; height: 26px; width: 26px;
    left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s;
  }
  input:checked + .slider { background: #3ab0ff; }
  input:checked + .slider::before { transform: translateX(24px); }
  .drying-controls { margin-top: 12px; }
  .power-btn {
    width: 100%; padding: 12px 8px; border-radius: 10px; border: none;
    background: #7a5210; color: #eee; font-size: 0.95rem; cursor: pointer;
  }
  .power-btn:active { opacity: 0.8; }
  .temp-control {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin-top: 20px;
  }
  .temp-btn {
    width: 56px; height: 56px; border-radius: 50%;
    border: none; background: #2c2c2c; color: #eee;
    font-size: 1.6rem; cursor: pointer;
  }
  .temp-btn:active { background: #3ab0ff; }
  .temp-value { font-size: 2rem; min-width: 90px; text-align: center; }
</style>
</head>
<body>
<h1>Klimatyzacja</h1>
<div id="devices"></div>

<script>
const deviceNames = {{ device_names | tojson }};

function render() {
  const container = document.getElementById('devices');
  container.innerHTML = deviceNames.map(name => `
    <div class="card" id="card-${name}">
      <div class="row">
        <div>
          <div class="name">${name}</div>
          <div class="indoor" id="indoor-${name}">-- °C</div>
          <div class="status-text" id="status-${name}"></div>
          <div class="error" id="error-${name}"></div>
        </div>
        <label class="switch">
          <input type="checkbox" id="power-${name}" onchange="onToggle('${name}', this.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <div class="drying-controls" id="drying-controls-${name}"></div>
      <div class="temp-control">
        <button class="temp-btn" onclick="changeTarget('${name}', -0.5)">-</button>
        <div class="temp-value" id="target-${name}">-- °C</div>
        <button class="temp-btn" onclick="changeTarget('${name}', 0.5)">+</button>
      </div>
    </div>
  `).join('');
}

function onToggle(name, checked) {
  if (checked) {
    setPower(name, true);
  } else {
    setPower(name, false, 'drying');
  }
}

const dryingRemaining = {};

function formatDuration(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function renderDryingStatus(name) {
  const remaining = dryingRemaining[name];
  document.getElementById('status-' + name).textContent =
    remaining !== undefined
      ? `Osuszanie - wyłączy się automatycznie za ${formatDuration(remaining)}`
      : '';
}

async function refreshStatus() {
  const res = await fetch('/api/status');
  const data = await res.json();
  for (const name of deviceNames) {
    const s = data[name];
    if (!s) continue;
    const cls = s.drying ? 'drying' : (s.power_on ? 'on' : 'off');
    document.getElementById('card-' + name).className = 'card ' + cls;
    document.getElementById('power-' + name).checked = s.power_on;
    document.getElementById('indoor-' + name).textContent =
      (s.indoor_temp !== null ? s.indoor_temp.toFixed(1) : '--') + ' °C w pokoju';
    if (s.drying && s.drying_remaining_seconds !== null) {
      dryingRemaining[name] = s.drying_remaining_seconds;
    } else {
      delete dryingRemaining[name];
    }
    renderDryingStatus(name);
    document.getElementById('drying-controls-' + name).innerHTML = s.drying
      ? `<button class="power-btn" onclick="setPower('${name}', false)">Anuluj osuszanie, wyłącz teraz</button>`
      : '';
    document.getElementById('target-' + name).textContent = s.target_temp.toFixed(1) + ' °C';
    document.getElementById('error-' + name).textContent = s.last_error || '';
  }
}

async function setPower(name, on, mode) {
  await fetch(`/api/devices/${name}/power`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({on, mode}),
  });
  refreshStatus();
}

let pendingTargets = {};
async function changeTarget(name, delta) {
  const el = document.getElementById('target-' + name);
  const current = parseFloat(el.textContent) || 24;
  const newTarget = Math.round((current + delta) * 2) / 2;
  el.textContent = newTarget.toFixed(1) + ' °C';
  await fetch(`/api/devices/${name}/target`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({target_temp: newTarget}),
  });
  refreshStatus();
}

function tickDrying() {
  for (const name of Object.keys(dryingRemaining)) {
    dryingRemaining[name] = Math.max(0, dryingRemaining[name] - 1);
    renderDryingStatus(name);
  }
}

render();
refreshStatus();
setInterval(refreshStatus, 5000);
setInterval(tickDrying, 1000);
</script>
</body>
</html>
